# nginx in front of the application.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kvaterka
#   sudo ln -s /etc/nginx/sites-available/kvaterka /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued by certbot, which rewrites the ssl_certificate lines below when
# it runs (see DEPLOYMENT.md). Nothing here duplicates a security header: the
# application sets HSTS, CSP with a per-request nonce, frame denial, nosniff,
# Referrer-Policy and Permissions-Policy itself, and a proxy that re-adds them
# is a proxy that will eventually disagree with the application about them.

# ---------------------------------------------------------------------------
# Plain HTTP exists only to be redirected, and to answer the ACME challenge.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kvaterka.by www.kvaterka.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kvaterka.by$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www redirects to the bare domain. One canonical name, decided once.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kvaterka.by;

    ssl_certificate     /etc/letsencrypt/live/kvaterka.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvaterka.by/privkey.pem;

    return 301 https://kvaterka.by$request_uri;
}

# ---------------------------------------------------------------------------
# The site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kvaterka.by;

    ssl_certificate     /etc/letsencrypt/live/kvaterka.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvaterka.by/privkey.pem;

    # An uploaded photograph is capped at 10 MB by the application; nginx has
    # to allow slightly more than that or it rejects the request before the
    # application can explain why.
    client_max_body_size 12m;

    # Do not announce the version to everyone who connects.
    server_tokens off;

    access_log /var/log/nginx/kvaterka.access.log;
    error_log  /var/log/nginx/kvaterka.error.log;

    # -----------------------------------------------------------------------
    # CLOSED STAGING GATE.
    #
    # While this deployment is a staging one on the real domain, everything
    # behind it is behind a password — because the product is not open, no
    # real person should reach a sign-up form, and robots.txt is a request
    # rather than a lock.
    #
    # Create the file with:
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/kvaterka.htpasswd staging
    #
    # DELETE these three lines on the day the product actually launches, and
    # not before.
    # -----------------------------------------------------------------------
    auth_basic           "Kvaterka.by — закрытое тестирование";
    auth_basic_user_file /etc/nginx/kvaterka.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # The application hashes this for rate limiting and audit, and trusts
        # it ONLY because nginx overwrites whatever the client sent.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Immutable build assets. Everything else is server-rendered per request
    # and must never be cached by a proxy — a cached page belonging to one
    # signed-in person served to another is the worst bug this file could
    # cause.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Assets are fingerprinted and carry nothing private; asking for a
        # password to load the stylesheet would break the login page itself.
        auth_basic off;
    }
}
